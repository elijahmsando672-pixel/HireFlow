<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Jobs | HireFlow</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hireflow.css">
</head>

<body>

    <header class="hireflow-nav">
        <div class="container nav-inner">
            <a href="dashboard.html" class="nav-logo"><img src="assets/logo.jpeg" alt="HireFlow" class="logo-img"></a>

            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="jobs.html" class="nav-link">Jobs</a>
                <a href="gigs.html" class="nav-link">Gigs</a>
                <a href="aggregated-jobs.html" class="nav-link">External Jobs</a>
                <a href="messages.html" class="nav-link">Inbox</a>
            </nav>

            <div class="nav-user">
                <button id="navAvatar" class="nav-avatar">C</button>
                <span id="navName" class="nav-name">Candidate</span>
                <button id="logoutBtn" class="nav-logout">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="page-toolbar">
            <div>
                <h1>Browse Jobs</h1>
                <p>Find your next opportunity or post your own.</p>
            </div>
            <a href="post-job.html" class="btn btn-primary">+ Post a Job</a>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search by title, company or skill...">

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>

            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>

            <select id="typeFilter">
                <option value="">All Types</option>
            </select>

            <select id="sortFilter">
                <option value="newest">Newest</option>
                <option value="salary">Highest Salary</option>
            </select>
        </div>

        <p class="results-info"><span id="resultsCount">0</span> jobs found</p>

        <div class="job-grid" id="jobGrid"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <h3>No jobs match your search</h3>
            <p>Try adjusting your search or filters.</p>
        </div>

    </main>

    <script src="js/data.js"></script>
    <script src="js/jobs.js"></script>
</body>
</html>
